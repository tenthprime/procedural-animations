<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js Ocean Beach & Shoreline Waves</title>
  <link rel="stylesheet" href="style.css">
  <!-- Three.js & OrbitControls from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Slide-In Control Drawer Toggle Button -->
  <button id="toggle-panel-btn" class="panel-toggle-btn" title="Toggle Controls">
    <span id="toggle-icon">⚙️</span> Controls
  </button>

  <!-- Slide-In Control Panel Drawer -->
  <div id="control-panel" class="panel">
    <div class="panel-header">
      <h2>🌊 Three.js Ocean Beach</h2>
      <p class="subtitle">Inspired by Dan Greenheck Water Rendering</p>
    </div>

    <div class="control-group">
      <label>Lighting & Time Preset:</label>
      <select id="select-preset">
        <option value="tropical">☀️ Tropical Afternoon Sun</option>
        <option value="sunset">🌅 Golden Hour Sunset</option>
        <option value="twilight">🌙 Moonlight Twilight</option>
      </select>
    </div>

    <div class="control-group">
      <label for="wave-height-slider">Wave Height: <span id="val-wave-height">1.8</span>m</label>
      <input type="range" id="wave-height-slider" min="0.2" max="4.0" step="0.1" value="1.8">
    </div>

    <div class="control-group">
      <label for="wave-speed-slider">Wave Speed: <span id="val-wave-speed">1.0</span>x</label>
      <input type="range" id="wave-speed-slider" min="0.2" max="3.0" step="0.1" value="1.0">
    </div>

    <div class="control-group">
      <label for="foam-slider">Shore Foam Intensity: <span id="val-foam">100</span>%</label>
      <input type="range" id="foam-slider" min="0" max="200" step="10" value="100">
    </div>

    <div class="control-group">
      <label class="chk-label"><input type="checkbox" id="chk-rotate" checked> Orbit Auto-Rotate Camera</label>
      <label class="chk-label"><input type="checkbox" id="chk-buoy" checked> Floating Buoys on Waves</label>
    </div>

    <div class="stats">
      <span>Wave Resolution: <span id="stat-grid">128x128</span></span>
      <span>FPS: <span id="stat-fps">60</span></span>
    </div>
  </div>

  <div class="hint">
    <span>🏖️ <strong>Drag Mouse</strong> to orbit 360° around the Beach & Waves! <strong>Scroll Wheel</strong> to Zoom.</span>
  </div>

  <script src="js/waveShaders.js"></script>
  <script src="js/beachTerrain.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
