<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js 3D Volumetric Voxel Cube Studio</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Slide-In Control Drawer Toggle Button -->
  <button id="toggle-panel-btn" class="panel-toggle-btn" title="Toggle Controls">
    <span id="toggle-icon">⚙️</span> Controls
  </button>

  <!-- Slide-In Control Panel Drawer -->
  <div id="control-panel" class="panel">
    <div class="panel-header">
      <h2>🧊 3D Volumetric Voxel Cube</h2>
      <p class="subtitle">Solid 3D Cube Monolith & Multi-Layer Depth</p>
    </div>

    <!-- Upload Custom Image / Face Button -->
    <div class="control-group">
      <label for="img-upload-input" class="upload-btn-label">
        📁 Upload Image / Face (.png/.jpg)
      </label>
      <input type="file" id="img-upload-input" accept="image/*" style="display: none;">
    </div>

    <div class="control-group">
      <label>3D Depth Extrusion Mode:</label>
      <select id="select-depth-mode">
        <option value="solid">🧊 Solid Volumetric Cube Block</option>
        <option value="terrain">🌋 Luminance 3D Terrain Relief</option>
        <option value="hollow">🐚 Hollow 3D Voxel Shell</option>
        <option value="globe">🔮 Spherical 3D Voxel Globe</option>
      </select>
    </div>

    <div class="control-group">
      <label>3D Voxel Geometry Shape:</label>
      <select id="select-shape">
        <option value="box">🧊 3D Voxels / Cubes</option>
        <option value="sphere">🟢 3D Spheres / Dots</option>
        <option value="cylinder">🧪 3D Cylinders / Pillars</option>
        <option value="cone">🔺 3D Pyramids / Crystals</option>
      </select>
    </div>

    <div class="control-group">
      <label>Shading & Material Theme:</label>
      <select id="select-material">
        <option value="standard">🎨 Standard Image Colors</option>
        <option value="metallic">✨ Metallic Reflection</option>
        <option value="neon">💖 Neon Cyberpunk Glow</option>
        <option value="glass">💎 Glass Crystal</option>
      </select>
    </div>

    <div class="control-group">
      <label for="depth-layers-slider">Z-Axis Depth Layers: <span id="val-layers">8</span> layers</label>
      <input type="range" id="depth-layers-slider" min="1" max="20" step="1" value="8">
    </div>

    <div class="control-group">
      <label for="grid-size-slider">3D Grid Resolution: <span id="val-grid">35</span> x <span id="val-grid-2">35</span></label>
      <input type="range" id="grid-size-slider" min="15" max="60" step="5" value="35">
    </div>

    <div class="control-group">
      <label for="extrude-scale-slider">3D Extrusion Depth Scale: <span id="val-scale">1.5</span>x</label>
      <input type="range" id="extrude-scale-slider" min="0.2" max="4.0" step="0.2" value="1.5">
    </div>

    <div class="control-group">
      <label for="wave-3d-slider">3D Wave Undulation: <span id="val-wave">1.0</span>x</label>
      <input type="range" id="wave-3d-slider" min="0.0" max="3.0" step="0.2" value="1.0">
    </div>

    <div class="control-group">
      <label class="chk-label"><input type="checkbox" id="chk-auto-rotate" checked> 360° Auto Camera Orbit</label>
      <label class="chk-label"><input type="checkbox" id="chk-waves" checked> 3D (X, Y, Z) Wave Undulation</label>
    </div>

    <button id="btn-gif" class="btn btn-gif">🎞️ Download Animated GIF</button>
    <button id="btn-download" class="btn btn-primary">📸 Download HD PNG</button>

    <div class="stats">
      <span>3D Voxels: <span id="stat-voxels">9800</span></span>
      <span>GPU Draw Calls: <span id="stat-draw">1</span></span>
    </div>
  </div>

  <div class="hint">
    <span>🖱️ Rotate camera 360° to view the <strong>solid 3D volumetric cube monolith</strong> with full Z-depth!</span>
  </div>

  <script src="js/cubeParser.js"></script>
  <script src="js/voxelCubeEngine.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
