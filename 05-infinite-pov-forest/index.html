<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endless POV Forest - Infinite 3D Flight</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Slide-In Control Drawer Toggle Button -->
  <button id="toggle-panel-btn" class="panel-toggle-btn" title="Toggle Controls">
    <span id="toggle-icon">⚙️</span> Controls
  </button>

  <!-- Slide-In Control Panel Drawer -->
  <div id="control-panel" class="panel">
    <div class="panel-header">
      <h2>🌲 Endless POV Forest</h2>
      <p class="subtitle">Infinite 3D First-Person Flight</p>
    </div>

    <div class="control-group">
      <label for="speed-slider">Flight Speed: <span id="val-speed">6.0</span></label>
      <input type="range" id="speed-slider" min="1.0" max="15.0" step="0.5" value="6.0">
    </div>

    <div class="control-group">
      <label for="density-slider">Tree Density: <span id="val-density">40</span></label>
      <input type="range" id="density-slider" min="15" max="80" step="5" value="40">
    </div>

    <div class="control-group">
      <label for="fog-slider">Fog Distance: <span id="val-fog">1200</span>px</label>
      <input type="range" id="fog-slider" min="500" max="2500" step="100" value="1200">
    </div>

    <div class="control-group">
      <label>Color Theme:</label>
      <select id="select-theme">
        <option value="abyssal">Deep Abyssal Ocean</option>
        <option value="neon">Neon Cyber Forest</option>
        <option value="emerald">Emerald Bioluminescence</option>
        <option value="violet">Violet Nebula</option>
      </select>
    </div>

    <div class="control-group">
      <label class="chk-label"><input type="checkbox" id="chk-steer" checked> Mouse Steer Camera</label>
      <label class="chk-label"><input type="checkbox" id="chk-sway" checked> Swaying Branches & Foliage</label>
    </div>

    <div class="stats">
      <span>Travel Distance: <span id="stat-dist">0</span>m</span>
      <span>FPS: <span id="stat-fps">60</span></span>
    </div>
  </div>

  <div class="hint">
    <span>🌲 Move <strong>Mouse</strong> to steer POV camera flight direction! Endless procedural 3D forest generation.</span>
  </div>

  <script src="js/forestEngine.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
