<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Animations Suite - Master Navigator</title>
  <link rel="stylesheet" href="hub-style.css">
</head>
<body>
  <!-- Master Top Navigation Bar -->
  <header class="master-header">
    <div class="brand">
      <span class="logo-icon">✨</span>
      <div class="brand-text">
        <h1>PROCEDURAL ANIMATIONS</h1>
        <span class="sub-brand">Creative Coding & Shader Suite</span>
      </div>
    </div>

    <!-- Quick Sketch Selector Tabs -->
    <nav class="sketch-tabs">
      <button class="tab-btn active" data-src="08-threejs-beach-waves/index.html" data-index="0">🏖️ Three.js Ocean Beach</button>
      <button class="tab-btn" data-src="07-procedural-owl/index.html" data-index="1">🦉 Celestial 3D Owl</button>
      <button class="tab-btn" data-src="06-procedural-glaciers/index.html" data-index="2">🧊 GLACIER Arctic</button>
      <button class="tab-btn" data-src="05-infinite-pov-forest/index.html" data-index="3">🌲 Endless POV Forest</button>
      <button class="tab-btn" data-src="01-sea-angels/index.html" data-index="4">👼 Sea Angels</button>
      <button class="tab-btn" data-src="02-okazz-constrain-wigglers/index.html" data-index="5">🌀 Okazz Wigglers</button>
      <button class="tab-btn" data-src="03-abyssal-living-deep/index.html" data-index="6">🌊 ABYSSAL Deep</button>
      <button class="tab-btn" data-src="04-tsubuyaki-glsl-shaders/index.html" data-index="7">✨ #つぶやきGLSL</button>
      <button class="tab-btn" data-src="01-deep-sea-aquarium/index.html" data-index="8">🐠 Full Aquarium</button>
    </nav>

    <!-- Cycle Next/Prev Controls -->
    <div class="nav-controls">
      <button id="btn-prev" class="nav-btn" title="Previous Sketch">◀ Prev</button>
      <button id="btn-next" class="nav-btn" title="Next Sketch">Next ▶</button>
      <button id="btn-fullscreen" class="nav-btn nav-icon-btn" title="Toggle Fullscreen">⛶</button>
    </div>
  </header>

  <!-- Fullscreen Interactive Canvas Frame -->
  <main class="viewer-container">
    <iframe id="sketch-frame" src="08-threejs-beach-waves/index.html" frameborder="0"></iframe>
  </main>

  <script>
    const sketches = [
      "08-threejs-beach-waves/index.html",
      "07-procedural-owl/index.html",
      "06-procedural-glaciers/index.html",
      "05-infinite-pov-forest/index.html",
      "01-sea-angels/index.html",
      "02-okazz-constrain-wigglers/index.html",
      "03-abyssal-living-deep/index.html",
      "04-tsubuyaki-glsl-shaders/index.html",
      "01-deep-sea-aquarium/index.html"
    ];

    let currentIndex = 0;
    const iframe = document.getElementById('sketch-frame');
    const tabs = document.querySelectorAll('.tab-btn');

    function loadSketch(index) {
      if (index < 0) index = sketches.length - 1;
      if (index >= sketches.length) index = 0;

      currentIndex = index;
      iframe.src = sketches[currentIndex];

      tabs.forEach((tab, i) => {
        if (i === currentIndex) tab.classList.add('active');
        else tab.classList.remove('active');
      });
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        let idx = parseInt(tab.getAttribute('data-index'));
        loadSketch(idx);
      });
    });

    document.getElementById('btn-prev').addEventListener('click', () => loadSketch(currentIndex - 1));
    document.getElementById('btn-next').addEventListener('click', () => loadSketch(currentIndex + 1));

    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    // Keyboard Arrow Keys to switch sketches
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') loadSketch(currentIndex - 1);
      if (e.key === 'ArrowRight') loadSketch(currentIndex + 1);
    });
  </script>
</body>
</html>
