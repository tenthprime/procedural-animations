<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okazz Constrain Kinematics Playground</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Slide-In Control Drawer Toggle Button -->
  <button id="toggle-panel-btn" class="panel-toggle-btn" title="Toggle Controls">
    <span id="toggle-icon">⚙️</span> Controls
  </button>

  <!-- Slide-In Control Panel Drawer -->
  <div id="control-panel" class="panel">
    <div class="panel-header">
      <h2>🌀 Okazz Constrain() Lab</h2>
      <p class="subtitle">Inspired by Okazz (@okazz_)</p>
    </div>

    <div class="control-group">
      <label>Creature Type:</label>
      <select id="select-species">
        <option value="ribbon">Ribbon Serpent</option>
        <option value="centipede">Glowing Centipede</option>
        <option value="dragon">Dual-Tail Dragon</option>
        <option value="neonworm">Neon Glow Worm</option>
      </select>
    </div>

    <div class="control-group">
      <label for="seg-slider">Segments: <span id="val-seg">32</span></label>
      <input type="range" id="seg-slider" min="10" max="60" step="2" value="32">
    </div>

    <div class="control-group">
      <label for="stiff-slider">Joint Distance: <span id="val-dist">14</span>px</label>
      <input type="range" id="stiff-slider" min="6" max="25" step="1" value="14">
    </div>

    <div class="control-group">
      <label for="wave-slider">Wave Frequency: <span id="val-wave">1.0</span>x</label>
      <input type="range" id="wave-slider" min="0.2" max="3.0" step="0.1" value="1.0">
    </div>

    <div class="control-group">
      <label class="chk-label"><input type="checkbox" id="chk-bounce" checked> Screen Edge Constrain Bounce</label>
      <label class="chk-label"><input type="checkbox" id="chk-fins" checked> Render Perpendicular Fin Rays</label>
      <label class="chk-label"><input type="checkbox" id="chk-debug"> Joint Skeleton Overlay</label>
    </div>

    <div class="btn-grid">
      <button id="btn-spawn" class="btn">Spawn Creature</button>
      <button id="btn-clear" class="btn btn-danger">Clear All</button>
    </div>
  </div>

  <div class="hint">
    <span>🌀 Move mouse over canvas to pull creatures using <strong>constrain() spring tension</strong>! Click canvas to spawn.</span>
  </div>

  <script src="js/wigglerChain.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
